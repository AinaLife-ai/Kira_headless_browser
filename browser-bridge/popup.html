<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Kira Browser Bridge</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; padding: 16px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px; color: #1f2328; background: #fff;
  }
  h1 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; flex: none; }
  /* 版本号：小、淡，但一直在 —— 用户报问题时报这一行就够了 */
  .tried { margin-top: 6px; line-height: 1.5; }
  .tried code { background: #f1f5f9; padding: 0 3px; border-radius: 3px; }
  #ver { font-size: 11px; font-weight: 400; color: #94a3b8; margin-left: 6px; }
  .dot.on { background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
  .dot.err { background: #dc2626; }
  label { display: block; font-size: 12px; color: #6b7280; margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; padding: 8px 10px; border: 1px solid #e3e6ea;
    border-radius: 6px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; background: #f6f7f9; color: #1f2328;
  }
  input:focus { outline: 2px solid #4f46e5; outline-offset: -1px; background: #fff; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    padding: 8px 14px; border: none; border-radius: 6px;
    background: #4f46e5; color: #fff; font-size: 12.5px; cursor: pointer;
  }
  button:hover { opacity: .9; }
  button.ghost { background: #f6f7f9; color: #4f46e5; border: 1px solid #e3e6ea; }
  button.danger { background: #dc2626; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; }
  .status {
    margin-top: 12px; padding: 9px 11px; border-radius: 6px;
    background: #f6f7f9; font-size: 12px; color: #6b7280;
    word-break: break-all; line-height: 1.5;
  }
  .status.err { background: #fef2f2; color: #b91c1c; }
  .hint { font-size: 11.5px; color: #9ca3af; margin-top: 6px; line-height: 1.5; }
  .divider { height: 1px; background: #e3e6ea; margin: 16px 0 12px; }
  .check { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; color: #374151; }
  .check input { width: auto; }
  a { color: #4f46e5; font-size: 11.5px; }
  /* 多实例选择：一台机器上跑了多个 KiraAI 时列出来让用户挑 */
  .instances { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .inst { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
  .inst .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inst .st { color: #6b7280; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span>Kira Browser Bridge
    <small id="ver" title="扩展版本 —— 报问题时请带上它，方便确认你装的是哪一版"></small>
  </h1>

  <label for="token">接入令牌</label>
  <input type="password" id="token" placeholder="点下面「自动检测」即可，不用手填" autocomplete="off">
  <div class="hint">
    首次使用点「自动检测」：会自动找到本机的 KiraAI，并把端口和令牌填好。<br>
    找不到时（比如 KiraAI 用了不常见的端口），有两条路：<br>
    ① 从 <b>127.0.0.1</b> 或 <b>localhost</b> 打开 KiraAI 的「全能浏览器」页面 ——
    <b>打开就会自动配对</b>，不用填；<br>
    ② 或者手动填：令牌在那一页点「复制」拿。
  </div>

  <div class="row" style="margin-top:10px">
    <div>
      <label for="host">服务地址</label>
      <input type="text" id="host" value="127.0.0.1">
    </div>
    <div style="max-width:100px">
      <label for="port">端口</label>
      <input type="number" id="port" value="5267">
    </div>
  </div>

  <div class="check">
    <input type="checkbox" id="autoConnect" checked>
    <label for="autoConnect" style="margin:0;font-size:12px;color:#374151">自动重连</label>
  </div>

  <div class="actions">
    <button id="btnAdd" class="ghost">添加</button>
    <button id="btnConnect">连接</button>
  </div>
  <div class="actions" style="margin-top:8px">
    <button id="btnDiscover" class="ghost">自动检测</button>
    <button id="btnDisconnect" class="ghost">断开</button>
    <button id="btnTest" class="ghost">测试链路</button>
  </div>

  <div class="status" id="status">读取中…</div>
  <div class="hint" id="usHint" style="display:none"></div>
  <div id="instances" class="instances"></div>

  <div class="divider"></div>
  <div class="hint">
    权限由 KiraAI 插件配置决定（默认可读写）<br>
    操作权限由 KiraAI 插件侧的配置决定。
  </div>

  <script src="popup.js"></script>
</body>
</html>
